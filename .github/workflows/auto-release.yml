name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR labels
        id: pr-labels
        run: |
          labels=$(echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | jq -r '.[]')
          echo "labels=$labels" >> $GITHUB_OUTPUT

          # Determine version bump type
          if echo "$labels" | grep -q "major"; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$labels" | grep -q "minor"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$labels" | grep -q "patch"; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "No version label found (major, minor, patch). Skipping release."
            echo "bump=none" >> $GITHUB_OUTPUT
          fi

      - name: Get latest tag
        id: latest-tag
        if: steps.pr-labels.outputs.bump != 'none'
        run: |
          # Get the latest tag, default to v0.0.0 if no tags exist
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT

          # Extract version numbers (remove 'v' prefix)
          version=${latest_tag#v}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new-version
        if: steps.pr-labels.outputs.bump != 'none'
        run: |
          current_version="${{ steps.latest-tag.outputs.version }}"
          bump_type="${{ steps.pr-labels.outputs.bump }}"

          # Split version into parts
          IFS='.' read -ra VERSION_PARTS <<< "$current_version"
          major=${VERSION_PARTS[0]:-0}
          minor=${VERSION_PARTS[1]:-0}
          patch=${VERSION_PARTS[2]:-0}

          # Increment based on bump type
          case $bump_type in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="$major.$minor.$patch"
          new_tag="v$new_version"

          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "tag=$new_tag" >> $GITHUB_OUTPUT
          echo "New version will be: $new_tag"

      - name: Set up Go
        if: steps.pr-labels.outputs.bump != 'none'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"

      - name: Run tests
        if: steps.pr-labels.outputs.bump != 'none'
        run: go test -v ./...

      - name: Create and push tag
        if: steps.pr-labels.outputs.bump != 'none'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${{ steps.new-version.outputs.tag }}" -m "Release ${{ steps.new-version.outputs.tag }}"
          git push origin "${{ steps.new-version.outputs.tag }}"

      - name: Run GoReleaser
        if: steps.pr-labels.outputs.bump != 'none'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
