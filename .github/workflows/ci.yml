  build:
    name: Build Binary
    runs-on: ${{ matrix.os }}
    # needs: [test, lint]

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.23.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build binary
        run: go build -v -o azure-searcher${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: Test binary execution
        if: matrix.os != 'windows-latest'
        run: |
          ./azure-searcher --help || true  # May fail without Azure CLI, but should not crash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-searcher-${{ matrix.os }}
          path: azure-searcher${{ matrix.os == 'windows-latest' && '.exe' || '' }}

